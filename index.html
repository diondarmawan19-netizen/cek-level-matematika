<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Math level of SMAPRESA Students</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    body {
      background-color: #f4f7f6;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }
    .card {
      background: #ffffff;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 450px;
      text-align: center;
    }
    h2 {
      color: #1a365d;
      margin-bottom: 8px;
    }
    p.subtitle {
      color: #718096;
      font-size: 14px;
      margin-bottom: 24px;
    }
    .input-group {
      margin-bottom: 20px;
    }
    input[type="text"] {
      width: 100%;
      padding: 12px;
      border: 2px solid #e2e8f0;
      border-radius: 8px;
      font-size: 16px;
      outline: none;
      transition: border-color 0.2s;
    }
    input[type="text"]:focus {
      border-color: #3182ce;
    }
    button {
      width: 100%;
      padding: 12px;
      background-color: #3182ce;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    button:hover {
      background-color: #2b6cb0;
    }
    .result-box {
      margin-top: 24px;
      padding: 20px;
      border-radius: 8px;
      display: none;
      text-align: left;
    }
    .result-box.success {
      background-color: #ebf8ff;
      border: 1px solid #bee3f8;
      color: #2b6cb0;
    }
    .result-box.error {
      background-color: #fff5f5;
      border: 1px solid #fed7d7;
      color: #c53030;
      text-align: center;
    }
    .result-item {
      margin-bottom: 10px;
    }
    .result-item:last-child {
      margin-bottom: 0;
    }
    .result-label {
      font-size: 12px;
      color: #4a5568;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .result-value {
      font-size: 18px;
      font-weight: bold;
      color: #1a202c;
    }
    .badge-level {
      display: inline-block;
      margin-top: 4px;
      padding: 6px 12px;
      background-color: #2b6cb0;
      color: white;
      border-radius: 20px;
      font-size: 14px;
      font-weight: bold;
    }
    .spinner {
      display: none;
      margin: 15px auto;
      border: 4px solid #f3f3f3;
      border-top: 4px solid #3182ce;
      border-radius: 50%;
      width: 30px;
      height: 30px;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>Math Level of SMA Prestasi Students</h2>
    <p class="subtitle">Input Your ID Number</p>

    <div class="input-group">
      <input type="text" id="nisInput" placeholder="Input Your ID Number (Example: 1001)" />
    </div>
    
    <button onclick="cekLevel()">Cek Hasil</button>

    <div class="spinner" id="spinner"></div>

    <div id="resultBox" class="result-box"></div>
  </div>

  <script>
    // GANTI URL DI BAWAH INI DENGAN URL WEB APP GOOGLE APPS SCRIPT ANDA
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzA8QYsgZvACjv8h_dtyIGUWxSwJiuXk4odd8fdJuBWCsfD9hX1qH7LKaok1RU8h9LvrQ/exec";

    function cekLevel() {
      const nis = document.getElementById('nisInput').value.trim();
      const resultBox = document.getElementById('resultBox');
      const spinner = document.getElementById('spinner');

      if (!nis) {
        alert("Please Input your ID Number");
        return;
      }

      // Reset tampilan
      resultBox.style.display = 'none';
      resultBox.className = 'result-box';
      spinner.style.display = 'block';

      fetch(`${SCRIPT_URL}?nis=${encodeURIComponent(nis)}`)
        .then(response => response.json())
        .then(data => {
          spinner.style.display = 'none';
          resultBox.style.display = 'block';

          if (data.found) {
            resultBox.classList.add('success');
            resultBox.innerHTML = `
              <div class="result-item">
                <div class="result-label">Nama Siswa</div>
                <div class="result-value">${data.nama}</div>
              </div>
              <hr style="border:0; border-top: 1px dashed #cbd5e0; margin: 12px 0;">
              <div class="result-item">
                <div class="result-label">Tingkat / Level Matematika</div>
                <div class="badge-level">${data.level}</div>
              </div>
              <div class="result-item" style="margin-top: 12px;">
                <div class="result-label">Catatan / Keterangan</div>
                <div style="color: #2d3748; font-size: 14px; margin-top: 4px;">${data.keterangan}</div>
              </div>
            `;
          } else {
            resultBox.classList.add('error');
            resultBox.innerHTML = `<strong>Data Tidak Ditemukan</strong><br><span style="font-size:14px;">${data.message}</span>`;
          }
        })
        .catch(error => {
          spinner.style.display = 'none';
          resultBox.style.display = 'block';
          resultBox.classList.add('error');
          resultBox.innerHTML = `<strong>Terjadi Kesalahan</strong><br><span style="font-size:13px;">Gagal terhubung ke server. Pastikan URL Script benar.</span>`;
          console.error('Error:', error);
        });
    }
  </script>

</body>
</html>
